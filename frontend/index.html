<body>

          <div>
            <div class="login-title">FaceMark</div>
            <div class="login-sub">Khelo India centre attendance</div>
          </div>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input id="login-username" class="form-input" autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input id="login-password" type="password" class="form-input" autocomplete="current-password">
          </div>
          <div id="login-error" class="login-error hidden"></div>
          <button type="submit" id="login-submit" class="btn btn-primary w-full">Sign in</button>
        </form>
        <div class="login-foot">
          Coaches see only their own centre. Super admins see every centre,
          all accounts and centre management.
        </div>
      </div>
    </div>

                <span class="logo-text">FaceMark</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#/dashboard" class="nav-item" data-route="/dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                    Dashboard
                </a>
                <a href="#/mark" class="nav-item" data-route="/mark">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    Mark Attendance
                </a>
                <a href="#/students" class="nav-item" data-route="/students">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Students
                </a>
                <a href="#/centres" class="nav-item" data-route="/centres">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Centres
                </a>
                <a href="#/users" class="nav-item" data-route="/users" data-role-only="super_admin">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 11h-6"></path></svg>

                <div class="status-indicator" style="margin-top:12px">

                    </div>

                        <option value="">No centre selected</option>

            </div>

            <div class="mark-layout">
                <!-- Left Panel -->

                    <div class="card">
                        <div class="card-header">

                                     The gallery upload is gone for that reason. -->

                                    <canvas id="camera-overlay" class="camera-overlay"></canvas>

                                    </div>

                                    <div class="rec-hint" id="rec-hint">Hold steady, then move the phone slightly while recording</div>

                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                        </button>

                                        </button>

    <script>
    // Registration is deliberately after load: a service worker installing
    // during startup competes with the app's own first requests.
    //
    // A home-screen PWA icon is not a browser tab a user habitually refreshes.
    // Without an explicit update path, a fix shipped to the server can sit
    // unused indefinitely in an already-installed app - the exact way "works
    // in the browser, not in the installed app" bugs get reported days after
    // the underlying issue was already fixed. skipWaiting()/clients.claim() in
    // sw.js make a new worker take over immediately once found; this reloads
    // the page ONCE when that happens, so the takeover actually reaches code
    // already running in memory rather than only affecting the next tab.
    if ('serviceWorker' in navigator) {
        // sw.js calls self.skipWaiting() unconditionally, so a new worker never
        // sits in "waiting" - it activates and claims every open client almost
        // immediately. What is missing without this listener is the reload: an
        // already-open page keeps running the OLD app.js from memory even after
        // the new worker takes over, because JS that has already executed does
        // not re-run itself. This reloads once when that handover happens.
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return;      // controllerchange can fire more than once
            reloaded = true;
            location.reload();
        });
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => { /* still works uninstalled */ });
        });
    }

    // Android fires beforeinstallprompt and lets us show our own button. iOS
    // never fires it and has no API - there, Safari's Share > Add to Home
    // Screen is the only route, so we tell the user that instead of showing a
    // button that cannot work.
    let deferredInstall = null;
    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredInstall = e;
        const b = document.getElementById('install-btn');
        if (b) b.classList.remove('hidden');
    });
    window.addEventListener('appinstalled', () => {
        deferredInstall = null;
        const b = document.getElementById('install-btn');
        if (b) b.classList.add('hidden');
    });
    async function installApp() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                             || window.navigator.standalone === true;
        if (isStandalone) { showToast('Already installed', 'You are using the installed app.', 'info'); return; }
        if (deferredInstall) {
            deferredInstall.prompt();
            await deferredInstall.userChoice;
            deferredInstall = null;
            return;
        }
        const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        showToast('Add to Home Screen',
                  iOS ? 'Tap the Share button in Safari, then "Add to Home Screen".'
                      : 'Open your browser menu and choose "Install app" or "Add to Home screen".',
                  'info');
    }
    </script>
</body>
</html>

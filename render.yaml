# Render blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# PLAN SIZING. Measured after the licence migration, not estimated:
#
#   memory      122 MB   (previous stack: 1,178 MB)
#   models       37 MB   (previous stack: 1,022 MB)
#   per photo   0.6 s    (previous stack: 12-16 s)
#
# YuNet (MIT) and SFace (Apache-2.0) replaced YOLO (AGPL-3.0) and the
# InsightFace ensemble (non-commercial research only), which also removed torch,
# ultralytics and onnxruntime. Starter is now comfortable; even Free fits on
# memory, though it has no persistent disk so enrolled templates would not
# survive a restart.

services:
  - type: web
    name: facemark-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter           # 512 MB is ample for a 122 MB footprint
    region: singapore       # closest region to India; also: oregon, frankfurt, ohio
    healthCheckPath: /api/health

    # No build args needed - both models are public and permissively licensed.

    # Persistent disk. Without it every deploy wipes the database, the enrolled
    # face templates and every uploaded photo.
    disk:
      name: facemark-data
      mountPath: /data
      sizeGB: 5

    envVars:
      - key: FACEMARK_DATA_DIR
        value: /data
      - key: FACEMARK_MODELS_DIR
        value: /app/data/models      # baked into the image, not the disk
      - key: DETECTION_MODE
        value: fused
      # ORT_THREADS is read by nothing: onnxruntime was removed with the licence
      # migration and OpenCV's DNN module runs the models now. Kept out of the
      # environment rather than left to imply a tuning knob that does not exist.
      #
      # CORS_ORIGINS: the origin the browser loads the app from, only needed when
      # it calls the API cross-site. This backend serves its own frontend, so
      # requests normally arrive same-origin and this can stay unset. A wildcard
      # is NOT valid here - session auth rides a credentialed cookie, which
      # browsers refuse alongside "*".
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      # First boot creates the 'admin' super admin with this password. Set it in
      # the Render dashboard; if omitted a random one is printed to the logs once.
      - key: FACEMARK_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      # REQUIRED. backend/config.py has no SQLite fallback - deliberately, so a
      # deployment cannot come up quietly writing to a container-local file that
      # vanishes on the next push - so without this the blueprint could not
      # start at all. It declared neither the variable nor a database to get it
      # from, which made this file a description of a deployment that has never
      # worked.
      - key: DATABASE_URL
        fromDatabase:
          name: facemark-db
          property: connectionString
      # One proxy in front (Render's edge), so X-Forwarded-For's last entry is
      # the real client. Anything to its left was written by the caller - see
      # auth.client_ip. Wrong here and the login and signup throttles are
      # bypassable by sending a header.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

databases:
  - name: facemark-db
    plan: basic-256mb
    region: singapore       # same region as the web service, or every query pays
                            # a cross-region round trip

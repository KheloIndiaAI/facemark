name: Deploy

# Deploys to the EC2 instance via AWS Systems Manager, NOT over SSH.
#
# WHY SSM RATHER THAN SSH
# The security group allows port 22 from one developer address only. An SSH
# deploy would mean opening 22 to GitHub's published runner ranges - thousands
# of addresses, rotating - and storing a private key in repository secrets.
# SSM inverts that: the instance's own agent polls AWS, so nothing new is
# exposed inbound and no key exists to leak.
#
# Credentials come from GitHub's OIDC provider, so there is no long-lived AWS
# access key in this repository either. See the one-time setup in DEPLOYMENT.md.
#
# Deploys track `dev`, which is the branch the instance was cloned from and the
# one it stays on. `main` deploys nowhere.
#
# GATED ON THE CHECKS. Both workflows used to fire on the same push and run
# side by side, so a commit that broke the lint gate or the drafts guard
# deployed anyway - CI going red afterwards changed nothing, and cancelling a
# CI run did not stop the deploy either. The `checks` job below reruns the two
# gates that matter and the deploy `needs:` it, so a broken commit fails before
# anything is built on the instance.
#
# `environment: production` remains the second net: add required reviewers under
# Settings -> Environments and each deploy also pauses for a click. Worth having
# on a system that holds photographs of children.
#
# One useful property of the command sequence: it runs under `set -eu`, so a
# failed `docker compose build` stops before `up -d` runs and the previously
# working container keeps serving. A broken commit fails the deploy rather than
# taking the service down.
#
# `set -eu`, NOT `set -euo pipefail`. SSM's AWS-RunShellScript executes under
# /bin/sh, which on Ubuntu is dash, and dash has no `pipefail` - it aborts with
# "Illegal option -o pipefail" before running a single command. There are no
# pipelines here, so the two are equivalent in effect anyway.

on:
  workflow_dispatch:            # manual deploy of any commit on dev
  push:
    branches: [dev]             # dev is the branch the instance tracks

concurrency:
  group: deploy
  cancel-in-progress: false     # never interrupt a half-finished deploy

permissions:
  id-token: write               # required to request the OIDC token
  contents: read

env:
  AWS_REGION: ap-south-1
  INSTANCE_TAG: Attendence-application
  APP_DIR: /opt/attendence-application
  HEALTH_URL: https://at.ccki.in/api/health

jobs:
  # The same two gates CI runs, rerun here so the deploy can depend on them.
  # Duplicated rather than chained off workflow_run: a workflow_run trigger
  # fires on the DEFAULT branch's copy of the workflow file and reports against
  # a detached commit, which makes "did this commit pass" hard to answer from
  # the deploy's own logs. These take well under a minute.
  checks:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff - runtime errors
        run: |
          ruff check --select E9,F63,F7,F82             --exclude scripts/archive --output-format=github .

      - name: Every module compiles
        run: |
          # Syntax and indentation across the whole backend. Cheap, needs no
          # dependencies, and catches the class of breakage that would otherwise
          # be discovered by the container failing to start on the instance.
          python -m compileall -q backend scripts run.py

  deploy:
    name: Deploy to EC2
    needs: checks               # a commit that fails the gates never deploys
    runs-on: ubuntu-latest
    environment: production     # add required reviewers here to gate deploys

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::114171679953:role/Attendence-application-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the instance
        id: instance
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_TAG}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$IID" != "None" ] || { echo "no running instance tagged ${INSTANCE_TAG}"; exit 1; }
          echo "id=$IID" >> "$GITHUB_OUTPUT"
          echo "Deploying to $IID"

      - name: Send deploy command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7} by ${GITHUB_ACTOR}" \
            --parameters commands="[
              \"set -eu\",
              \"cd ${APP_DIR}\",
              \"git fetch --all --prune\",
              \"git reset --hard ${GITHUB_SHA}\",
              \"docker compose build app\",
              \"docker compose up -d app\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.instance.outputs.id }}" || true

          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query 'Status' --output text)
          [ "$STATUS" = "Success" ] || { echo "deploy command status: $STATUS"; exit 1; }

      # The deploy is not done until the application answers. A container that
      # starts and then fails its first database call would otherwise look green.
      - name: Verify health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${HEALTH_URL}" > /tmp/h.json 2>/dev/null; then
              cat /tmp/h.json
              grep -q '"database":"ok"' /tmp/h.json && exit 0
            fi
            sleep 5
          done
          echo "service did not report healthy after deploy"
          cat /tmp/h.json 2>/dev/null || true
          exit 1

      # ALWAYS RUNS, pass or fail. Added after two consecutive deploys (one
      # with the new code, one with it fully reverted) both failed the health
      # check identically - build succeeds, container reports Started, then
      # zero HTTP responses for 100s. Since reverting the application code did
      # not change the outcome, the "Verify health" step above cannot say WHY:
      # it only knows the box never answered, not what the container, Caddy or
      # the disk were doing while it didn't. This pulls that directly.
      - name: Diagnostics (always)
        if: always()
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "post-deploy diagnostics" \
            --parameters commands="[
              \"cd ${APP_DIR}\",
              \"echo ---DOCKER-PS---\",
              \"docker compose ps -a\",
              \"echo ---DISK---\",
              \"df -h\",
              \"echo ---MEMORY---\",
              \"free -m\",
              \"echo ---APP-LOGS---\",
              \"docker compose logs app --tail 150 --no-color\",
              \"echo ---DB-LOGS---\",
              \"docker compose logs db --tail 30 --no-color\",
              \"echo ---CADDY-STATUS---\",
              \"systemctl status caddy --no-pager || true\",
              \"echo ---LOCAL-CURL---\",
              \"curl -sS -m 5 http://localhost:8000/api/health || echo LOCAL_CURL_FAILED\"
            ]" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.id }}" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' \
            --output text

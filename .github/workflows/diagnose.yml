name: Diagnose

# READ-ONLY. Manual dispatch only - never runs on push, never touches git state
# on the instance, never rebuilds or restarts anything. Exists to answer "what
# is actually happening on the box" when a deploy's health check fails and the
# GitHub Actions log alone (docker compose build/up transcript) does not say
# why the container isn't answering.
#
# Uses the same OIDC role the deploy workflow does - no new credentials.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  INSTANCE_TAG: Attendence-application
  APP_DIR: /opt/attendence-application

jobs:
  diagnose:
    name: Read-only diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::114171679953:role/Attendence-application-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the instance
        id: instance
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_TAG}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$IID" != "None" ] || { echo "no running instance tagged ${INSTANCE_TAG}"; exit 1; }
          echo "id=$IID" >> "$GITHUB_OUTPUT"

      - name: Send diagnostic command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "diagnose - read only" \
            --parameters commands="[
              \"set -x\",
              \"cd ${APP_DIR}\",
              \"echo ---DOCKER-PS---\",
              \"docker compose ps -a\",
              \"echo ---DISK---\",
              \"df -h\",
              \"echo ---MEMORY---\",
              \"free -m\",
              \"echo ---APP-LOGS---\",
              \"docker compose logs app --tail 150 --no-color\",
              \"echo ---DB-LOGS---\",
              \"docker compose logs db --tail 50 --no-color\",
              \"echo ---CADDY-STATUS---\",
              \"systemctl status caddy --no-pager || true\",
              \"echo ---LOCAL-CURL---\",
              \"curl -sS -m 5 http://localhost:8000/api/health || echo LOCAL_CURL_FAILED\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and print output
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.instance.outputs.id }}" || true

          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' \
            --output text
